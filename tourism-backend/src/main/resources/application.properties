# =========================================================
# Tourism Package Management System - Backend Configuration
# =========================================================

spring.application.name=tourism-backend
server.port=${PORT:8080}

# ---------------------------------------------------------
# Apache Derby (embedded, file-based, no external DB server)
# The database files live under ./data relative to the working
# directory the JVM is started from.
# ---------------------------------------------------------
spring.datasource.url=jdbc:derby:${DERBY_DB_PATH:./data/tourismdb};create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.username=tourism
spring.datasource.password=tourism

# Hibernate 6 moved Derby support to the hibernate-community-dialects module;
# DerbyDialect auto-detects the running Derby version's capabilities.
spring.jpa.database-platform=org.hibernate.community.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------------------------------------------------------
# JWT
# In production, override app.jwt.secret via an environment
# variable (APP_JWT_SECRET). Never commit real secrets.
# ---------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:tourism-demo-only-secret-key-change-me-please-32bytesmin}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------
# CORS - comma separated list of allowed frontend origins
# ---------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------------------------------------------------------
# Demo data
# ---------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:true}

# ---------------------------------------------------------
# Actuator - only expose health, for hosting platform health checks
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------
# Cancellation policy (days-before-trip thresholds)
# ---------------------------------------------------------
app.cancellation.full-refund-days=7
app.cancellation.partial-refund-days=3
app.cancellation.partial-refund-percentage=50

# ---------------------------------------------------------
# Never expose stack traces to clients
# ---------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.org.springframework.security=WARN
logging.level.com.tourism=INFO
